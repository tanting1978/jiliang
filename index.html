<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極亮廣告燈箱 - 同行專屬系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #2c3e50;
            --container-bg: #34495e;
            --text-main: #ecf0f1;
            --accent: #3498db;
            --input-bg: #22313f;
        }

        body { font-family: -apple-system, "Noto Sans TC", sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 10px; }
        .container { max-width: 480px; background: var(--container-bg); padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin: auto; }
        
        /* 鎖定畫面樣式 */
        #auth-screen { text-align: center; padding: 40px 20px; }
        .lock-icon { font-size: 50px; margin-bottom: 20px; }
        
        /* 主功能畫面 - 預設隱藏 */
        #main-content { display: none; }

        input, select { 
            width: 100%; padding: 12px; border: 1.5px solid #7f8c8d; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px; background-color: var(--input-bg); color: var(--text-main);
            margin-bottom: 15px;
        }
        
        button { 
            width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 1em; 
            font-weight: bold; cursor: pointer; color: white; background: var(--accent);
        }

        /* 報價單與資訊樣式 (承襲之前版本) */
        .logo-area { text-align: center; margin-bottom: 20px; }
        .logo-area img { max-width: 150px; }
        #quote-result { margin-top: 20px; padding: 20px; background: var(--input-bg); border: 2px solid var(--accent); border-radius: 10px; }
        .price-item { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #333; }
        .total-price { font-size: 2em; color: #e74c3c; font-weight: bold; text-align: center; margin: 15px 0; }
        .company-info { margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 0.9em; border-left: 5px solid var(--accent); line-height: 1.7; }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-screen">
        <div class="lock-icon">🔒</div>
        <h3>同行專屬報價系統</h3>
        <p style="color: #bdc3c7;">請輸入通行暗號以進入系統</p>
        <input type="password" id="passkey" placeholder="輸入暗號" style="text-align: center;">
        <button onclick="checkAuth()">驗證進入</button>
        <p id="auth-msg" style="color: #e74c3c; margin-top: 10px; font-size: 0.9em;"></p>
    </div>

    <div id="main-content">
        <div style="text-align: center; color: var(--accent); font-weight: bold; margin-bottom: 20px;">✓ 已認證同行身分</div>
        
        <label>📏 1. 輸入尺寸 (公分)</label>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="w" placeholder="寬">
            <input type="number" id="h" placeholder="高">
        </div>

        <label>🖼️ 2. 鋁型材-框厚度</label>
        <select id="frame" onchange="updateLightOptions()">
            <option value="4" data-price="4">4cm (4元/cm)</option>
            <option value="6" data-price="4.5">6cm (4.5元/cm)</option>
            <option value="6.5" data-price="4.5">6.5cm (4.5元/cm)</option>
            <option value="7.8" data-price="4.5">7.8cm (4.5元/cm)</option>
            <option value="8" data-price="5">8cm (5元/cm)</option>
            <option value="8_special" data-price="5">1.5特價款 8cm (5元/cm)</option>
            <option value="10" data-price="5.5">10cm (5.5元/cm)</option>
            <option value="12" data-price="6">12cm (6元/cm)</option>
        </select>

        <label>💡 3. 燈條規格</label>
        <select id="light"></select>

        <label>🎨 4. 燈布材質</label>
        <select id="fabric">
            <option value="50">軟膜燈布 (50元/才)</option>
            <option value="70">UV燈布-台製 (70元/才)</option>
            <option value="55">杜邦紙 (55元/才)</option>
            <option value="60">云絲軟軟膜 (60元/才)</option>
            <option value="80">A級防火布 (80元/才)</option>
        </select>

        <label>🪵 5. 背板材質</label>
        <select id="backboard">
            <option value="50">塑鋁板 (50元/才)</option>
            <option value="40">發泡板 (40元/才)</option>
        </select>

        <button onclick="calculate()" style="background: var(--accent);">🚀 開始報價</button>

        <div id="screenshot-area">
            <div id="quote-result" style="display: none;">
                <div class="logo-area"><img src="logo.png" onerror="this.style.display='none';"></div>
                <div style="text-align:center; font-weight:bold; margin-bottom:15px;">卡布燈箱報價明細</div>
                <div id="res_list"></div> <div class="total-price" id="res_total">總計：$ 0</div>
                <div class="company-info">
                    <b style="color:var(--accent); font-size:1.1em;">極亮廣告燈箱</b><br>
                    電話：04-22370107 | LINE：@jiliang<br>
                    業務：趙恆毅 0921-159127
                </div>
            </div>
        </div>
        
        <div id="action-btns" style="display:none; margin-top:15px; gap:10px;">
            <button onclick="sendLine()" style="background:#00c300;">💬 傳送至 LINE</button>
            <button onclick="takeScreenshot()" style="background:#7f8c8d;">📸 產生截圖</button>
        </div>
    </div>
</div>

<script>
// --- 設定您的暗號 ---
const CORRECT_PASSKEY = "22370107"; 

function checkAuth() {
    const input = document.getElementById('passkey').value;
    if (input === CORRECT_PASSKEY) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
    } else {
        document.getElementById('auth-msg').innerText = "暗號錯誤，請重新輸入！";
    }
}

// 價格資料與邏輯 (與前版相同)
const lightPrices = {
    "4": { "tw_wp": 360, "sa_wp": 240, "tw_in": 216, "sa_in": 144, "sa_sp": 108 },
    "6": { "tw_wp": 225, "sa_wp": 150, "tw_in": 135, "sa_in": 90, "sa_sp": 67.5 },
    "6.5": { "tw_wp": 225, "sa_wp": 150, "tw_in": 135, "sa_in": 90, "sa_sp": 67.5 },
    "7.8": { "tw_wp": 180, "sa_wp": 120, "tw_in": 108, "sa_in": 72, "sa_sp": 54 },
    "8": { "tw_wp": 180, "sa_wp": 120, "tw_in": 108, "sa_in": 72, "sa_sp": 54 },
    "8_special": { "tw_wp": 180, "sa_wp": 120, "tw_in": 108, "sa_in": 72, "sa_sp": 54 },
    "10": { "tw_wp": 150, "sa_wp": 100, "tw_in": 90, "sa_in": 60, "sa_sp": 45 },
    "12": { "tw_wp": 120, "sa_wp": 80, "tw_in": 72, "sa_in": 48, "sa_sp": 36 }
};

function updateLightOptions() {
    const frame = document.getElementById('frame').value;
    const lightSelect = document.getElementById('light');
    const p = lightPrices[frame];
    lightSelect.innerHTML = `
        <option value="${p.tw_wp}">防水-台灣晶元 (${p.tw_wp}元/才)</option>
        <option value="${p.sa_wp}">防水-三安 (${p.sa_wp}元/才)</option>
        <option value="${p.tw_in}">室內-台灣晶元 (${p.tw_in}元/才)</option>
        <option value="${p.sa_in}">室內-三安 (${p.sa_in}元/才)</option>
        <option value="${p.sa_sp}">室內-三安特價 (${p.sa_sp}元/才)</option>
    `;
}

function calculate() {
    const w = parseFloat(document.getElementById('w').value) || 0;
    const h = parseFloat(document.getElementById('h').value) || 0;
    if (w <= 0 || h <= 0) return;

    const size = (w * h) / 900;
    const perimeter = (w + h) * 2;
    const assembleCost = size < 40 ? 1000 : Math.round(size * 25);
    
    const frameOpt = document.getElementById('frame').selectedOptions[0];
    const frameP = Math.round(perimeter * parseFloat(frameOpt.getAttribute('data-price')));
    const lightP = Math.round(size * parseFloat(document.getElementById('light').value));
    const fabricP = Math.round(size * parseFloat(document.getElementById('fabric').value));
    const backP = Math.round(size * parseFloat(document.getElementById('backboard').value));
    const total = frameP + lightP + fabricP + backP + assembleCost;

    document.getElementById('res_list').innerHTML = `
        <div class="price-item"><span>尺寸：</span><span>${w}x${h}cm (${size.toFixed(2)}才)</span></div>
        <div class="price-item"><span>鋁框：</span><span>$${frameP.toLocaleString()}</span></div>
        <div class="price-item"><span>燈條：</span><span>$${lightP.toLocaleString()}</span></div>
        <div class="price-item"><span>燈布：</span><span>$${fabricP.toLocaleString()}</span></div>
        <div class="price-item"><span>背板：</span><span>$${backP.toLocaleString()}</span></div>
        <div class="price-item"><span>組裝：</span><span>$${assembleCost.toLocaleString()}</span></div>
    `;
    document.getElementById('res_total').innerText = "總計：$ " + total.toLocaleString();
    document.getElementById('quote-result').style.display = 'block';
    document.getElementById('action-btns').style.display = 'flex';
}

function takeScreenshot() {
    html2canvas(document.getElementById('screenshot-area'), { backgroundColor: '#2c3e50' }).then(canvas => {
        const link = document.createElement('a');
        link.download = '報價單.png';
        link.href = canvas.toDataURL();
        link.click();
    });
}
// LINE 傳送與初始化略... (保持邏輯)
updateLightOptions();
</script>
</body>
</html>
