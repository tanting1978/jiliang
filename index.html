<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極亮廣告 - 報價管理系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --bg: #2c3e50; --card: #34495e; --text: #ecf0f1; --accent: #3498db; --input: #22313f; }
        body { font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; font-size: 20px; }
        .container { max-width: 500px; background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); margin: auto; min-height: 95vh; }
        
        #auth-screen { text-align: center; padding: 60px 20px; }
        #home-menu { display: none; }
        
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .menu-btn { background: var(--input); border: 2px solid var(--accent); padding: 25px 10px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 22px; min-height: 110px; display: flex; align-items: center; justify-content: center; }
        .menu-btn:hover { background: var(--accent); }

        .page { display: none; }
        .back-btn { width: 100%; background: #5f6368; color: white; padding: 20px; border-radius: 12px; font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 25px; cursor: pointer; border: none; }

        label { display: block; margin-bottom: 12px; font-weight: bold; font-size: 22px; color: var(--accent); }
        input, select { width: 100%; padding: 15px; border: 1.5px solid #7f8c8d; border-radius: 8px; box-sizing: border-box; font-size: 20px; background: var(--input); color: var(--text); margin-bottom: 18px; }
        button { width: 100%; padding: 18px; border: none; border-radius: 8px; font-size: 22px; font-weight: bold; cursor: pointer; color: white; background: var(--accent); }
        
        .res-box { margin-top: 20px; padding: 25px; background: var(--input); border: 3px solid var(--accent); border-radius: 12px; display: none; }
        .quote-header { text-align: center; font-size: 26px; font-weight: bold; color: var(--accent); border-bottom: 3px solid var(--accent); margin-bottom: 15px; padding-bottom: 10px; }
        .price-item { display: flex; flex-direction: column; margin-bottom: 12px; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .price-label { font-size: 18px; color: var(--accent); font-weight: bold; }
        .price-content { display: flex; justify-content: space-between; font-size: 22px; margin-top: 5px; }
        .total-price { font-size: 2.8em; color: #e74c3c; font-weight: bold; text-align: center; margin: 20px 0; border-top: 2px dashed #7f8c8d; padding-top: 15px; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: var(--input); font-size: 16px; }
        th, td { border: 1px solid #555; padding: 10px; text-align: center; }
        th { background: var(--accent); color: white; }
        .tag-kabu { color: #3498db; font-weight: bold; }
        .tag-labu { color: #e67e22; font-weight: bold; }
        .tag-double { color: #9b59b6; font-weight: bold; }

        .company-footer { margin-top: 30px; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 12px; line-height: 1.6; border: 1px solid #555; }
        .comp-name { font-size: 26px; font-weight: bold; color: var(--accent); display: block; margin-bottom: 8px; text-align: center; }
        .comp-detail { font-size: 18px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-screen">
        <h2 style="color:var(--accent);">極亮廣告同行系統</h2>
        <input type="password" id="passkey" placeholder="輸入公司電話驗證" style="text-align: center;">
        <button onclick="checkAuth()">進入系統</button>
    </div>

    <div id="home-menu">
        <div style="text-align: center;"><span style="font-size: 32px; font-weight: bold; color:var(--accent);">極亮廣告報價中心</span></div>
        <div class="menu-grid">
            <div class="menu-btn" onclick="showPage('kabudengxiang')">卡布燈箱</div>
            <div class="menu-btn" onclick="showPage('labudengxiang')">拉布燈箱-戶外</div>
            <div class="menu-btn" onclick="showPage('double_kabu')">雙面卡布燈箱</div>
            <div class="menu-btn" onclick="showPage('baozhu_kabu')">包柱卡布燈箱</div>
            <div class="menu-btn" onclick="showPage('material_page')">單型材系列</div>
            <div class="menu-btn" onclick="alert('模組開發中')">發光字系列</div>
            <div class="menu-btn" onclick="alert('模組開發中')">燈帶/燈條</div>
            <div class="menu-btn" onclick="alert('模組開發中')">材料系列</div>
        </div>
        <div class="company-footer">
            <span class="comp-name">極亮廣告燈箱</span>
            <span class="comp-detail">電話：04-22370107 | 趙恆毅 0921-159127</span>
        </div>
    </div>

    <!-- 單型材專頁 -->
    <div id="material_page" class="page">
        <button class="back-btn" onclick="goHome()">回首頁選單</button>
        <p style="background:#e74c3c; color:white; padding:10px; border-radius:5px; text-align:center; font-weight:bold; font-size:18px;">整支出售，一支 300 公分直角裁切，不裁角度</p>
        <label>1. 選擇型材類別</label>
        <select id="m_cat" onchange="updateMItems()">
            <option value="k">卡布型材系列</option>
            <option value="l">拉布型材系列</option>
            <option value="d">雙面型材系列</option>
            <option value="p">配件/轉角柱</option>
        </select>
        <label>2. 選擇規格</label>
        <select id="m_item"></select>
        <label>3. 數量 (支/組)</label>
        <input type="number" id="m_qty" value="1" min="1">
        <button onclick="addM()" style="background:#27ae60;">加入報價清單</button>
        <button onclick="clearM()" style="background:#5f6368; margin-top:10px;">清空清單</button>
        
        <div id="m_res_area">
            <div id="m_result" class="res-box">
                <div class="quote-header">單型材報價單</div>
                <div id="m_table_container"></div>
                <div class="total-price" id="m_total">$ 0</div>
                <div class="company-footer">
                    <span class="comp-name">極亮廣告燈箱</span>
                    <span class="comp-detail">電話：04-22370107 | 趙恆毅 0921-159127</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 其他頁面 (卡布/拉布/雙面/包柱) 邏輯壘加 -->
    <div id="kabudengxiang" class="page"><button class="back-btn" onclick="goHome()">回首頁選單</button><label>卡布尺寸</label>...計算邏輯同前...</div>
</div>

<script>
const PASSKEY = "22370107";
const M_LIST = {
    k: [
        {n:"[卡布] 4CM",p:1200},{n:"[卡布] 6CM",p:1350},{n:"[卡布] 6.5CM",p:1350},{n:"[卡布] 8CM",p:1500},{n:"[卡布] 7.8CM(特價)",p:1350}
    ],
    l: [
        {n:"[拉布] 側開蓋 8CM",p:1650},{n:"[拉布] 側開蓋 12CM",p:1800},{n:"[拉布] 正開蓋 5CM",p:2850},{n:"[拉布] 正開蓋 6.5CM(8面)",p:3150},{n:"[拉布] 正開蓋 6.5CM(10面)",p:3300},{n:"[拉布] 正開蓋 9CM(12面)",p:3750},{n:"[拉布] 正開蓋 6.5CM(15面)",p:3900}
    ],
    d: [
        {n:"[雙面] 4.5CM",p:1650},{n:"[雙面] 4.95CM",p:1800},{n:"[雙面] 7.8CM",p:1950},{n:"[雙面] 8CM",p:1950},{n:"[雙面] 10CM",p:2100},{n:"[雙面] 12CM",p:2250},{n:"[雙面] 15CM",p:2400},{n:"[雙面] 16CM",p:2250}
    ],
    p: [
        {n:"轉角柱",p:600},{n:"接板支撐柱",p:600},{n:"角碼(組)",p:80},{n:"連接駁條(組)",p:60}
    ]
};

let currentM = [];

function checkAuth(){ if(document.getElementById('passkey').value===PASSKEY){document.getElementById('auth-screen').style.display='none';document.getElementById('home-menu').style.display='block';} }
function showPage(id){ document.querySelectorAll('.page').forEach(p=>p.style.display='none'); document.getElementById('home-menu').style.display='none'; document.getElementById(id).style.display='block'; window.scrollTo(0,0); if(id==='material_page')updateMItems(); }
function goHome(){ document.querySelectorAll('.page').forEach(p=>p.style.display='none'); document.getElementById('home-menu').style.display='block'; }

function updateMItems(){
    const c = document.getElementById('m_cat').value, s = document.getElementById('m_item');
    s.innerHTML = "";
    M_LIST[c].forEach((item, i) => s.options.add(new Option(`${item.n} ($${item.p})`, i)));
}

function addM(){
    const c = document.getElementById('m_cat').value, i = document.getElementById('m_item').value, q = parseInt(document.getElementById('m_qty').value)||1;
    const item = M_LIST[c][i];
    currentM.push({n: item.n, q: q, p: item.p, t: item.p*q, cat: c});
    renderMTable();
}

function renderMTable(){
    let gT = 0;
    let html = '<table><tr><th>品項規格</th><th>數量</th><th>單價</th><th>小計</th></tr>';
    currentM.forEach(item => {
        gT += item.t;
        let tagClass = item.cat === 'k' ? 'tag-kabu' : (item.cat === 'l' ? 'tag-labu' : (item.cat === 'd' ? 'tag-double' : ''));
        html += `<tr><td class="${tagClass}" style="text-align:left;">${item.n}</td><td>${item.q}</td><td>${item.p}</td><td>${item.t}</td></tr>`;
    });
    html += '</table>';
    document.getElementById('m_table_container').innerHTML = html;
    document.getElementById('m_total').innerText = "$ " + gT.toLocaleString();
    document.getElementById('m_result').style.display = 'block';
    
    // 增加截圖按鈕
    if(!document.getElementById('m_snap_btn')){
        const btn = document.createElement('button');
        btn.id = 'm_snap_btn';
        btn.innerText = '產生報價截圖';
        btn.style.marginTop = '15px';
        btn.style.background = '#7f8c8d';
        btn.onclick = () => takeSnap('m_result');
        document.getElementById('m_res_area').appendChild(btn);
    }
}

function clearM(){ currentM = []; document.getElementById('m_result').style.display = 'none'; if(document.getElementById('m_snap_btn')) document.getElementById('m_snap_btn').remove(); }
function takeSnap(id){ html2canvas(document.getElementById(id),{backgroundColor:'#34495e',scale:2}).then(canvas=>{const l=document.createElement('a');l.download='極亮型材報價.png';l.href=canvas.toDataURL();l.click();}); }
</script>
</body>
</html>
